name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devvault-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30

    steps:
      - name: Pull and deploy
        shell: bash
        run: |
          set -euo pipefail
          cd /home/jun/devvault
          git fetch origin main
          git merge --ff-only origin/main
          cd devvault
          docker compose up -d --build --remove-orphans

      - name: Verify health
        shell: bash
        run: |
          set -euo pipefail
          cd /home/jun/devvault/devvault
          for attempt in {1..24}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"' \
              && curl -fsS http://127.0.0.1:3000 >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          docker compose logs --tail=100 app frontend
          exit 1
