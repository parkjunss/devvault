name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devvault-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/devvault"
          docker compose \
            --project-name devvault \
            --env-file /home/jun/devvault/devvault/.env \
            -f compose.yaml \
            -f compose.production.yaml \
            up -d --build --remove-orphans

      - name: Verify health
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/devvault"
          compose=(docker compose --project-name devvault \
            --env-file /home/jun/devvault/devvault/.env \
            -f compose.yaml \
            -f compose.production.yaml)
          for attempt in {1..24}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"' \
              && curl -fsS http://127.0.0.1:3000 >/dev/null; then
              "${compose[@]}" ps
              exit 0
            fi
            sleep 5
          done
          "${compose[@]}" logs --tail=100 app frontend
          exit 1
